name: Build Boot Image (SM-T583)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 수동 실행 가능하게 설정

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set execution permissions
        run: |
          chmod +x build.sh
          # 만약 mkbootimg 같은 바이너리가 레포지토리에 포함되어 있다면 함께 권한 부여
          if [ -f "mkbootimg" ]; then chmod +x mkbootimg; fi

      - name: Run Build Script
        run: ./build.sh

      - name: Upload boot.img Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SM-T583-boot-image
          path: out/boot.img
