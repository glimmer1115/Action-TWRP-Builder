name: Build Boot Image (SM-T583)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget python3

      - name: Install android-bootimg-tool
        run: |
          # 경량 빌드 도구 설치 (mkbootimg 대용)
          git clone https://github.com/osm0sis/android-bootimg-tool.git
          cd android-bootimg-tool
          make
          sudo cp android-bootimg-tool /usr/local/bin/

      - name: Run Build Script
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload Boot Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-image-sm-t583
          path: boot.img
