name: Build Boot Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libssl-dev

      - name: Install mkbootimg
        run: |
          # Install android-sdk-libbootimg or a standalone mkbootimg
          sudo apt-get install -y android-sdk-libbootimg || \
          (git clone https://github.com/osm0sis/mkbootimg.git && cd mkbootimg && make && sudo cp mkbootimg /usr/local/bin/)

      - name: Make script executable
        run: chmod +x build.sh

      - name: Run build script
        run: ./build.sh

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-image-smt583
          path: boot.img
