name: Recovery Build
on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'TWRP manifest URL'
        required: false
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni'
      MANIFEST_BRANCH:
        description: 'TWRP manifest branch'
        required: false
        default: 'twrp-6.0'
      DEVICE_TREE_URL:
        description: '디바이스 트리 git URL'
        required: true
      DEVICE_TREE_BRANCH:
        description: '디바이스 트리 브랜치'
        required: false
        default: 'android-6.0'
      CODENAME_SRC:
        description: '트리의 원래 코드네임'
        required: false
        default: 'gtaxlwifi'
      CODENAME_DST:
        description: '내 기기 코드네임'
        required: false
        default: ''
      LUNCH_TARGET:
        description: 'lunch 대상'
        required: false
        default: ''
      STOCK_RECOVERY_URL:
        description: '순정 recovery.img URL'
        required: false
        default: ''
      USE_STOCK_KERNEL:
        description: '순정 recovery 의 kernel 을 강제 사용'
        type: boolean
        required: false
        default: false
      PUBLISH_RELEASE:
        description: 'GitHub Release 로도 업로드'
        type: boolean
        required: false
        default: false

env:
  MANIFEST_URL: ${{ github.event.inputs.MANIFEST_URL }}
  MANIFEST_BRANCH: ${{ github.event.inputs.MANIFEST_BRANCH }}
  DEVICE_TREE_URL: ${{ github.event.inputs.DEVICE_TREE_URL }}
  DEVICE_TREE_BRANCH: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
  CODENAME_SRC: ${{ github.event.inputs.CODENAME_SRC }}
  CODENAME_DST: ${{ github.event.inputs.CODENAME_DST }}
  LUNCH_TARGET_IN: ${{ github.event.inputs.LUNCH_TARGET }}
  STOCK_RECOVERY_URL: ${{ github.event.inputs.STOCK_RECOVERY_URL }}
  USE_STOCK_KERNEL: ${{ github.event.inputs.USE_STOCK_KERNEL }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Check Out
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cleanup disk
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Prepare the environment
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq \
            git curl wget unzip zip tar bc bison flex m4 gperf ccache lzop lz4 liblz4-tool \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev lib32z1-dev lib32readline-dev \
            libncurses5 libncurses-dev libxml2-utils xsltproc libssl-dev squashfs-tools \
            schedtool pngcrush imagemagick python2 python3 android-sdk-libsparse-utils \
            device-tree-compiler
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python2 10
          sudo update-alternatives --set python /usr/bin/python2
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true

      - name: Install OpenJDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize and sync repo
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@users.noreply.github.com"
          mkdir -p workspace && cd workspace
          repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags

      - name: Prepare stock recovery
        run: |
          mkdir -p tools stock
          if [ -f "$GITHUB_WORKSPACE/recovery.img" ]; then
            cp "$GITHUB_WORKSPACE/recovery.img" stock/stock_recovery.img
          elif [ -n "$STOCK_RECOVERY_URL" ]; then
            wget -nv "$STOCK_RECOVERY_URL" -O stock/stock_recovery.img
          else
            echo "::error::recovery.img missing"
            exit 1
          fi
          wget -nv https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O tools/magisk.apk
          unzip -j -o tools/magisk.apk 'lib/x86_64/libmagiskboot.so' -d tools
          mv tools/libmagiskboot.so tools/magiskboot
          chmod +x tools/magiskboot

      - name: Configure Device Tree
        working-directory: workspace
        run: |
          TREE_NAME="${CODENAME_DST:-$CODENAME_SRC}"
          TREE_DIR="device/samsung/${TREE_NAME}"
          echo "TREE_DIR=$TREE_DIR" >> "$GITHUB_ENV"
          mkdir -p device/samsung
          git clone --depth=1 "$DEVICE_TREE_URL" -b "$DEVICE_TREE_BRANCH" "$TREE_DIR"
          rm -rf "$TREE_DIR/.git"
          if [ -n "$CODENAME_DST" ] && [ "$CODENAME_DST" != "$CODENAME_SRC" ]; then
            cd "$TREE_DIR"
            find . -depth -name "*${CODENAME_SRC}*" | while read -r p; do
              d=$(dirname "$p"); b=$(basename "$p")
              mv "$p" "$d/${b//$CODENAME_SRC/$CODENAME_DST}"
            done
            grep -rIl -- "$CODENAME_SRC" . | xargs -r sed -i "s/${CODENAME_SRC}/${CODENAME_DST}/g"
            cd - >/dev/null
          fi
          if [ -n "$LUNCH_TARGET_IN" ]; then
            LUNCH="$LUNCH_TARGET_IN"
          else
            MK=$(ls "$TREE_DIR"/omni_*.mk "$TREE_DIR"/twrp_*.mk 2>/dev/null | head -n1 || true)
            LUNCH="$(basename "$MK" .mk)-eng"
          fi
          echo "LUNCH=$LUNCH" >> "$GITHUB_ENV"

      - name: Build recovery
        working-directory: workspace
        run: |
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch "$LUNCH"
          make -j"$(nproc)" recoveryimage 2>&1 | tee build.log

      - name: High-Reliability Transplant (Surgical Grade)
        working-directory: workspace
        run: |
          PROD_DIR=$(ls -d out/target/product/*/ | head -n1)
          FIX_BASE="$PWD/transplant_final"
          STOCK_UNPACK="$FIX_BASE/stock_rd"
          TWRP_UNPACK="$FIX_BASE/twrp_rd"
          mkdir -p "$STOCK_UNPACK" "$TWRP_UNPACK"
          
          # 1. 순정 램디스크 추출 (magiskboot 기반 신뢰성 확보)
          STOCK_IMG="$GITHUB_WORKSPACE/stock/stock_recovery.img"
          "$GITHUB_WORKSPACE/tools/magiskboot" unpack "$STOCK_IMG"
          # magiskboot unpack은 현재 작업 디렉토리에 ramdisk.cpio를 생성함
          if [ -f "$GITHUB_WORKSPACE/stock/ramdisk.cpio" ]; then
            cp "$GITHUB_WORKSPACE/stock/ramdisk.cpio" "$FIX_BASE/stock.cpio"
          else
            # 혹시 경로가 다를 경우를 대비해 검색
            find $GITHUB_WORKSPACE -name "ramdisk.cpio" -exec cp {} "$FIX_BASE/stock.cpio" \;
          fi
          (cd "$STOCK_UNPACK" && cpio -idmv < "$FIX_BASE/stock.cpio")
          
          # 2. TWRP 램디스크 추출
          RD_FILE=""
          for f in "$PROD_DIR"ramdisk-recovery.img "$PROD_DIR"ramdisk-recovery.cpio.gz "$PROD_DIR"ramdisk-recovery.cpio; do
            if [ -f "$f" ]; then RD_FILE="$f"; break; fi
          done
          if [[ "$RD_FILE" == *.gz ]] || file "$RD_FILE" | grep -q "gzip"; then
            zcat "$RD_FILE" > "$FIX_BASE/twrp.cpio"
          else
            cp "$RD_FILE" "$FIX_BASE/twrp.cpio"
          fi
          (cd "$TWRP_UNPACK" && cpio -idmv < "$FIX_BASE/twrp.cpio")
          
          # 3. [정밀 이식] - 환경은 유지, 엔진만 교체
          echo "Executing High-Reliability Transplant..."
          
          # A. 핵심 바이너리 교체 (/sbin/recovery)
          if [ -f "$TWRP_UNPACK/sbin/recovery" ]; then
            mkdir -p "$STOCK_UNPACK/sbin"
            cp -f "$TWRP_UNPACK/sbin/recovery" "$STOCK_UNPACK/sbin/recovery"
            chmod 755 "$STOCK_UNPACK/sbin/recovery"
          fi
          
          # B. 라이브러리 완전 이식 (모든 .so 파일을 /sbin에 배치하여 Linker 오류 방지)
          find "$TWRP_UNPACK" -name "*.so*" -exec cp -f {} "$STOCK_UNPACK/sbin/" \;
          find "$STOCK_UNPACK/sbin" -name "*.so*" -exec chmod 644 {} \;
          
          # C. 설정 파일 및 프로퍼티 주입
          if [ -f "$TWRP_UNPACK/default.prop" ]; then
            cp -f "$TWRP_UNPACK/default.prop" "$STOCK_UNPACK/default.prop"
          fi
          
          # D. 부팅 성공을 위한 필수 속성 강제 추가
          printf "ro.debuggable=1\nro.secure=0\nandroidboot.selinux=permissive\npersist.sys.usb.config=mtp\n" >> "$STOCK_UNPACK/default.prop"
          
          # 4. 패키징
          (cd "$STOCK_UNPACK" && find . | cpio -o -H newc | gzip -6 > "$FIX_BASE/final_transplanted_rd.gz")
          cp "$FIX_BASE/final_transplanted_rd.gz" "$PROD_DIR"ramdisk-recovery.img.patched

      - name: Package for Odin
        working-directory: workspace
        run: |
          WS="$PWD"
          IMG=$(ls out/target/product/*/recovery.img | head -n1)
          PROD_DIR=$(dirname "$IMG")
          mkdir -p output
          
          cat > "$WS/repack.py" <<'PY'
          import sys, struct, hashlib, gzip
          def pad(n, p): return (-n) % p
          src, dst, rd_path = sys.argv[1:4]
          extra_cmd = sys.argv[4] if len(sys.argv) > 4 else ""
          data = open(src, "rb").read()
          if data[:8] != b"ANDROID!": sys.exit("Not a boot image")
          (k_size, k_addr, r_size, r_addr, s_size, s_addr, t_addr, p_size, v40, os_v) = struct.unpack_from("<10I", data, 8)
          name = data[48:64]
          cmdline = data[64:576]
          idv = data[576:608]
          extra = data[608:1632]
          pos = p_size
          kernel = data[pos:pos + k_size]
          pos += k_size + pad(k_size, p_size)
          ramdisk = data[pos:pos + r_size]
          pos += r_size + pad(r_size, p_size)
          second = data[pos:pos + s_size]
          pos += s_size + pad(s_size, p_size)
          dt = data[pos:pos + v40] if v40 > 4 else b""
          cmd_str = cmdline.split(b"\0")[0].decode("latin1")
          extra_str = extra.split(b"\0")[0].decode("latin1")
          if rd_path == "-":
              new_rd = ramdisk
          else:
              new_rd = open(rd_path, "rb").read()
              if new_rd[:2] != b"\x1f\x8b":
                  new_rd = gzip.compress(new_rd, 6)
          if extra_cmd:
              if len(cmd_str) + len(extra_cmd) < 511:
                  cmd_str = (cmd_str + " " + extra_cmd).strip()
              else:
                  extra_str = (extra_str + " " + extra_cmd).strip()
          sha = hashlib.sha1()
          for b in (kernel, new_rd, second):
              sha.update(b); sha.update(struct.pack("<I", len(b)))
          if dt: sha.update(dt); sha.update(struct.pack("<I", len(dt)))
          new_id = sha.digest().ljust(32, b"\0")
          hdr = struct.pack("<8s10I16s512s32s1024s", b"ANDROID!", k_size, k_addr, len(new_rd), r_addr, s_size, s_addr, t_addr, p_size, v40, os_v, name, cmd_str.encode("latin1"), new_id, extra_str.encode("latin1"))
          out = bytearray(hdr)
          out += b"\0" * pad(len(out), p_size)
          for b in (kernel, new_rd, second, dt):
              if b: out += b + b"\0" * pad(len(b), p_size)
          out += b"SEANDROIDENFORCE"
          open(dst, "wb").write(out)
          PY

          mkdir -p pack_native
          cp "$IMG" pack_native/recovery.img
          (cd pack_native && tar -H ustar -c recovery.img > ../output/twrp_native.tar)
          cp pack_native/recovery.img output/recovery_native.img

          PATCHED_RD=$(ls out/target/product/*/ramdisk-recovery.img.patched | head -n1)
          EXTRA_OPTS="androidboot.selinux=permissive wait_for_resume=0"
          
          if [ -n "$PATCHED_RD" ] && python3 "$WS/repack.py" "$GITHUB_WORKSPACE/stock/stock_recovery.img" "$WS/repack_out.img" "$PATCHED_RD" "$EXTRA_OPTS"; then
            mkdir -p pack_repack
            cp repack_out.img pack_repack/recovery.img
            (cd pack_repack && tar -H ustar -c recovery.img > ../output/twrp_repack.tar)
            cp pack_repack/recovery.img output/recovery_repack.img
          fi

          python3 "$WS/repack.py" "$GITHUB_WORKSPACE/stock/stock_recovery.img" "$WS/ctrl_out.img" "-" "$EXTRA_OPTS"
          mkdir -p pack_ctrl
          cp ctrl_out.img pack_ctrl/recovery.img
          (cd pack_ctrl && tar -H ustar -c recovery.img > ../output/ctrl_stock_repack.tar)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twrp-recovery
          path: workspace/output/*

      - name: Upload to Release
        if: ${{ github.event.inputs.PUBLISH_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: twrp-${{ github.run_number }}
          name: "TWRP Recovery #${{ github.run_number }}"
          files: workspace/output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
