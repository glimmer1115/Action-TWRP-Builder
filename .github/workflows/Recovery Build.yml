name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL'
        required: false
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: false
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: false
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 python-is-python3 tar

    - name: Install OpenJDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Install repo
      run: |
        sudo apt-get update
        sudo apt-get install -y repo

    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "Nico170420"
        git config --global user.email "b170420nc@gmail.com"
        
        REAL_M_URL="${{ github.event.inputs.MANIFEST_URL }}"
        if [ -z "$REAL_M_URL" ]; then
          REAL_M_URL="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni"
        fi
        
        REAL_M_BRANCH="${{ github.event.inputs.MANIFEST_BRANCH }}"
        if [ -z "$REAL_M_BRANCH" ]; then
          REAL_M_BRANCH="twrp-8.1"
        fi
        
        repo init --depth=1 -u $REAL_M_URL -b$REAL_M_BRANCH
      id: pwd

    - name: Repo Sync
      run: |
        repo sync -c -j4 --force-sync --no-clone-bundle --no-tags
      working-directory: workspace

    - name: Configure Unlocked Device Tree
      run: |
        REAL_D_URL="${{ github.event.inputs.DEVICE_TREE_URL }}"
        REAL_D_BRANCH="${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        REAL_D_PATH="device/samsung/gtaxlwi"
        
        if [ -n "$REAL_D_URL" ]; then
          git clone $REAL_D_URL -b ${REAL_D_BRANCH:-android-8.1} ./$REAL_D_PATH || true
        fi
        
        # 디바이스 트리가 없거나 보완이 필요한 경우 패치된 락 해제 설정 적용
        mkdir -p ./$REAL_D_PATH
        
        echo "PRODUCT_MAKEFILES := \$(LOCAL_DIR)/omni_gtaxlwi.mk" > ./$REAL_D_PATH/AndroidProducts.mk
        
        echo "\$(call inherit-product, \$(SRC_TARGET_DIR)/product/full_base.mk)" > ./$REAL_D_PATH/omni_gtaxlwi.mk
        echo "PRODUCT_NAME := omni_gtaxlwi" >> ./$REAL_D_PATH/omni_gtaxlwi.mk
        echo "PRODUCT_DEVICE := gtaxlwi" >> ./$REAL_D_PATH/omni_gtaxlwi.mk
        echo "PRODUCT_BRAND := samsung" >> ./$REAL_D_PATH/omni_gtaxlwi.mk
        echo "PRODUCT_MODEL := SM-T583" >> ./$REAL_D_PATH/omni_gtaxlwi.mk
        
        # BoardConfig.mk (교육용 락, dm-verity, 강제 암호화 무력화 옵션 주입)
        cat << 'EOF' > ./$REAL_D_PATH/BoardConfig.mk
        TARGET_OTA_LIST_MAX_SIZE := 117964800
        TARGET_DEVICE := gtaxlwi
        TARGET_ARCH := arm64
        TARGET_ARCH_VARIANT := armv8-a
        TARGET_CPU_ABI := arm64-v8a

        # 디스플레이 설정
        TW_THEME := portrait_hdpi
        DEVICE_RESOLUTION := 1200x1920
        TARGET_SCREEN_WIDTH := 1200
        TARGET_SCREEN_HEIGHT := 1920

        # 부팅 보안 및 dm-verity / AVB 우회 설정
        BOARD_AVB_ENABLE := false
        TW_INCLUDE_CRYPTO := false
        TW_NEVER_UNMOUNT_SYSTEM := true
        TW_NO_REBOOT_BOOTLOADER := true
        TW_HAS_DOWNLOAD_MODE := true
        
        # 더미 커널 허용 옵션
        TARGET_NO_KERNEL := true
        EOF
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Building recovery & Odin Packaging
      run: |
        sed -i 's/except IOError, ES.ParseError:/except (IOError, ES.ParseError):/g' vendor/omni/build/tools/roomservice.py || true
        
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        
        lunch omni_gtaxlwi-eng || lunch omni_gtaxlwi-userdebug
        
        # 더미 커널 파일 생성
        mkdir -p out/target/product/gtaxlwi
        touch out/target/product/gtaxlwi/kernel
        
        make recoveryimage -j$(nproc --all)
        
        # output 폴더 생성 및 Odin 플래싱용 .tar 압축
        mkdir -p ../output
        if [ -f out/target/product/gtaxlwi/recovery.img ]; then
          cp -v out/target/product/gtaxlwi/recovery.img ../output/
          cd out/target/product/gtaxlwi/
          tar -cf ../../../../output/twrp_smt583_unlocked.tar recovery.img
          cd ../../../..
        fi
        
        # 빌드 결과 확인
        ls -la ../output
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: twrp-smt583-unlocked
        path: output/*

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: output/*
        name: sm-t583-twrp-unlocked-build
        tag_name: ${{ github.run_id }}
        body: |
          삼성 갤럭시 탭 Advanced2 (SM-T583) 암호화 및 부팅 락 해제 패치 적용 TWRP 빌드 완료.
          - Odin 플래싱 시 `twrp_smt583_unlocked.tar` 파일을 AP 항목에 넣어 사용하세요.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
