name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL'
        required: false
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: false
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: false
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: false
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: false
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: false
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: false
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 python-is-python3 tar

    - name: Install OpenJDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Install repo
      run: |
        sudo apt-get update
        sudo apt-get install -y repo

    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "Nico170420"
        git config --global user.email "b170420nc@gmail.com"
        
        REAL_M_URL="${{ github.event.inputs.MANIFEST_URL }}"
        if [ -z "$REAL_M_URL" ]; then
          REAL_M_URL="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni"
        fi
        
        REAL_M_BRANCH="${{ github.event.inputs.MANIFEST_BRANCH }}"
        if [ -z "$REAL_M_BRANCH" ]; then
          REAL_M_BRANCH="twrp-8.1"
        fi
        
        repo init --depth=1 -u $REAL_M_URL -b $REAL_M_BRANCH
      id: pwd

    - name: Repo Sync
      run: |
        repo sync -c -j4 --force-sync --no-clone-bundle --no-tags
      working-directory: workspace

    - name: Clone device tree
      run: |
        REAL_D_URL="${{ github.event.inputs.DEVICE_TREE_URL }}"
        REAL_D_BRANCH="${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        REAL_D_PATH="device/samsung/gtaxlwi"
        
        if [ -n "$REAL_D_URL" ]; then
          git clone $REAL_D_URL -b ${REAL_D_BRANCH:-android-8.1} ./$REAL_D_PATH || true
        fi
        
        if [ ! -f "./$REAL_D_PATH/AndroidProducts.mk" ]; then
          echo "디바이스 트리를 자동 구성합니다."
          mkdir -p ./$REAL_D_PATH
          
          echo "PRODUCT_MAKEFILES := \$(LOCAL_DIR)/omni_gtaxlwi.mk" > ./$REAL_D_PATH/AndroidProducts.mk
          
          echo "\$(call inherit-product, \$(SRC_TARGET_DIR)/product/full_base.mk)" > ./$REAL_D_PATH/omni_gtaxlwi.mk
          echo "PRODUCT_NAME := omni_gtaxlwi" >> ./$REAL_D_PATH/omni_gtaxlwi.mk
          echo "PRODUCT_DEVICE := gtaxlwi" >> ./$REAL_D_PATH/omni_gtaxlwi.mk
          echo "PRODUCT_BRAND := samsung" >> ./$REAL_D_PATH/omni_gtaxlwi.mk
          echo "PRODUCT_MODEL := SM-T580" >> ./$REAL_D_PATH/omni_gtaxlwi.mk
          
          echo "TARGET_OTA_LIST_MAX_SIZE := 117964800" > ./$REAL_D_PATH/BoardConfig.mk
          echo "TARGET_DEVICE := gtaxlwi" >> ./$REAL_D_PATH/BoardConfig.mk
          echo "TARGET_ARCH := arm64" >> ./$REAL_D_PATH/BoardConfig.mk
          echo "TARGET_ARCH_VARIANT := armv8-a" >> ./$REAL_D_PATH/BoardConfig.mk
          echo "TARGET_CPU_ABI := arm64-v8a" >> ./$REAL_D_PATH/BoardConfig.mk
          
          # TWRP 해상도 및 테마 지정
          echo "TW_THEME := portrait_hdpi" >> ./$REAL_D_PATH/BoardConfig.mk
          echo "DEVICE_RESOLUTION := 1200x1920" >> ./$REAL_D_PATH/BoardConfig.mk
          echo "TARGET_SCREEN_WIDTH := 1200" >> ./$REAL_D_PATH/BoardConfig.mk
          echo "TARGET_SCREEN_HEIGHT := 1920" >> ./$REAL_D_PATH/BoardConfig.mk
          
          # 커널 소스 누락 처리 (TARGET_NO_KERNEL 설정)
          echo "TARGET_NO_KERNEL := true" >> ./$REAL_D_PATH/BoardConfig.mk
          echo "TARGET_PREBUILT_KERNEL :=" >> ./$REAL_D_PATH/BoardConfig.mk
          echo "BOARD_MKBOOTIMG_ARGS :=" >> ./$REAL_D_PATH/BoardConfig.mk
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Check Build Tree
      uses: haya14busa/action-cond@v1
      id: buildtree
      with:
        cond: 'false'
        if_true: twrp
        if_false: omni

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Building recovery
      run: |
        sed -i 's/except IOError, ES.ParseError:/except (IOError, ES.ParseError):/g' vendor/omni/build/tools/roomservice.py || true
        
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        
        # 만약 커널 파일 생성이 빌드 타겟 요구사항에 남아있을 경우를 대비한 더미 파일 보장
        mkdir -p out/target/product/gtaxlwi
        touch out/target/product/gtaxlwi/kernel
        
        lunch omni_gtaxlwi-eng || lunch omni_gtaxlwi-userdebug
        make recoveryimage -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: | 
          workspace/out/target/product/gtaxlwi/recovery.img
          workspace/out/target/product/gtaxlwi/ramdisk-recovery.cpio
        name: sm-t583-twrp-build
        tag_name: ${{ github.run_id }}
        body: |
          삼성 갤럭시 탭 Advanced2 (SM-T583) 커스텀 TWRP 빌드 완료.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
