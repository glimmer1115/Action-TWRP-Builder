    - name: Building recovery & Magiskboot Repackaging
      run: |
        # 1. Prebuilts 및 도구 설정
        mkdir -p prebuilts/misc/linux-x86/bison prebuilts/misc/linux-x86/flex prebuilts/build-tools/linux-x86/bin
        wget -q https://raw.githubusercontent.com/LineageOS/android_prebuilts_build-tools/lineage-17.1/linux-x86/bin/bison -O prebuilts/build-tools/linux-x86/bin/bison
        chmod +x prebuilts/build-tools/linux-x86/bin/bison
        ln -sf $(pwd)/prebuilts/build-tools/linux-x86/bin/bison prebuilts/misc/linux-x86/bison/bison
        ln -sf $(which flex) prebuilts/misc/linux-x86/flex/flex || true
        ln -sf $(which m4) prebuilts/build-tools/linux-x86/bin/m4 || true
        
        # 2. [강화됨] Python 3 호환성 패치
        echo "Applying ultra-robust Python 3 compatibility patches..."
        
        # 2to3 도구 설치 (가장 확실한 변환 방법)
        sudo apt-get install -y 2to3
        
        # .iteritems() -> .items() 변경
        find . -type f -name "*.py" -exec sed -i 's/\.iteritems()/\.items()/g' {} + || true
        
        # [수정] 더 강력한 print 문 변환 정규식
        # print "내용" % 변수 -> print("내용" % 변수) 형태로 강제 변환
        find . -type f -name "*.py" -exec sed -i -E 's/^([[:space:]]*)print[[:space:]]+([^(\n]*)$/\1print(\2)/g' {} + || true
        
        # 위 sed로도 안 잡히는 경우를 위해 2to3를 사용하여 전체 변환 (시간이 조금 더 걸리지만 확실함)
        # 빌드 시스템 내의 모든 .py 파일에 대해 print 문 등 주요 문법 자동 변환
        find . -type f -name "*.py" -exec 2to3 -w -n {} + || true

        # 특정 에러 패턴 수정 (roomservice.py 등)
        if [ -f vendor/omni/build/tools/roomservice.py ]; then
          sed -i 's/except IOError, ES.ParseError:/except (IOError, ES.ParseError):/g' vendor/omni/build/tools/roomservice.py
        fi
        
        # 3. 빌드 환경 설정
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch omni_gtaxladwifikx-eng
        
        # 빌드 에러 방지를 위한 더미 파일 생성
        mkdir -p out/target/product/gtaxladwifikx
        touch out/target/product/gtaxladwifikx/kernel
        mkdir -p out/target/product/gtaxladwifikx/system/bin
        touch out/target/product/gtaxladwifikx/system/bin/linker
        touch out/target/product/gtaxladwifikx/system/bin/linker64
        
        make recoveryimage -j$(nproc --all)
        
        # 4. 후처리 및 리패키징
        mkdir -p ../output
        wget https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
        unzip -j Magisk-v27.0.apk "lib/x86_64/libmagiskboot.so" -d .
        mv libmagiskboot.so magiskboot
        chmod +x magiskboot
        
        STOCK_URL="${{ github.event.inputs.STOCK_RECOVERY_URL }}"
        if [ -n "$STOCK_URL" ]; then
          wget $STOCK_URL -O stock_recovery.img
        fi
        
        if [ -f stock_recovery.img ]; then
          echo "Starting repackaging with stock recovery..."
          mkdir stock_rec && cd stock_rec
          ../magiskboot unpack ../stock_recovery.img
          if [ -f ../out/target/product/gtaxladwifikx/ramdisk-recovery.cpio ]; then
            cp ../out/target/product/gtaxladwifikx/ramdisk-recovery.cpio ramdisk.cpio
            ../magiskboot repack ../stock_recovery.img ../output/recovery.img
          else
            echo "Error: ramdisk-recovery.cpio not found."
            exit 1
          fi
          cd ..
        elif [ -f out/target/product/gtaxladwifikx/recovery.img ]; then
          cp -v out/target/product/gtaxladwifikx/recovery.img ../output/
        fi
        
        cd ../output
        dd if=/dev/zero of=vbmeta.img bs=256 count=1
        if [ -f recovery.img ]; then
          tar -cf twrp_smt583_avb_disabled.tar recovery.img vbmeta.img
        fi
        ls -la
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
