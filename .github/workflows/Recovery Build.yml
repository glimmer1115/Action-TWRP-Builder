name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL'
        required: false
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: false
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: false
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libncurses5 libtinfo5 libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 python-is-python3 python2 tar android-sdk-libsparse-utils || true
            
        # 심볼릭 링크 강제 연결 (python 및 libncurses5)
        sudo ln -sf /usr/bin/python3 /usr/bin/python || true
        sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 || true
        sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true

    - name: Install OpenJDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Install repo
      run: |
        sudo apt-get update
        sudo apt-get install -y repo

    - name: Initialize repo
      id: pwd
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "Nico170420"
        git config --global user.email "b170420nc@gmail.com"
        
        REAL_M_URL="${{ github.event.inputs.MANIFEST_URL }}"
        if [ -z "$REAL_M_URL" ]; then
          REAL_M_URL="https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni"
        fi
        
        REAL_M_BRANCH="${{ github.event.inputs.MANIFEST_BRANCH }}"
        if [ -z "$REAL_M_BRANCH" ]; then
          REAL_M_BRANCH="twrp-8.1"
        fi
        
        repo init --depth=1 -u $REAL_M_URL -b $REAL_M_BRANCH

    - name: Repo Sync
      run: |
        repo sync -c -j4 --force-sync --no-clone-bundle --no-tags
      working-directory: workspace

    - name: Configure Device Tree (SM-T583 / gtaxladwifikx)
      run: |
        REAL_D_URL="${{ github.event.inputs.DEVICE_TREE_URL }}"
        REAL_D_BRANCH="${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        REAL_D_PATH="device/samsung/gtaxladwifikx"
        
        if [ -n "$REAL_D_URL" ]; then
          git clone $REAL_D_URL -b ${REAL_D_BRANCH:-android-8.1} ./$REAL_D_PATH || true
        fi
        
        mkdir -p ./$REAL_D_PATH
        
        echo "PRODUCT_MAKEFILES := \$(LOCAL_DIR)/omni_gtaxladwifikx.mk" > ./$REAL_D_PATH/AndroidProducts.mk
        
        echo "\$(call inherit-product, \$(SRC_TARGET_DIR)/product/full_base.mk)" > ./$REAL_D_PATH/omni_gtaxladwifikx.mk
        echo "PRODUCT_NAME := omni_gtaxladwifikx" >> ./$REAL_D_PATH/omni_gtaxladwifikx.mk
        echo "PRODUCT_DEVICE := gtaxladwifikx" >> ./$REAL_D_PATH/omni_gtaxladwifikx.mk
        echo "PRODUCT_BRAND := samsung" >> ./$REAL_D_PATH/omni_gtaxladwifikx.mk
        echo "PRODUCT_MODEL := SM-T583" >> ./$REAL_D_PATH/omni_gtaxladwifikx.mk
        
        # BoardConfig.mk 설정
        echo "TARGET_OTA_LIST_MAX_SIZE := 117964800" > ./$REAL_D_PATH/BoardConfig.mk
        echo "TARGET_DEVICE := gtaxladwifikx" >> ./$REAL_D_PATH/BoardConfig.mk
        echo "TARGET_ARCH := arm64" >> ./$REAL_D_PATH/BoardConfig.mk
        echo "TARGET_ARCH_VARIANT := armv8-a" >> ./$REAL_D_PATH/BoardConfig.mk
        echo "TARGET_CPU_ABI := arm64-v8a" >> ./$REAL_D_PATH/BoardConfig.mk
        echo "TARGET_2ND_ARCH := arm" >> ./$REAL_D_PATH/BoardConfig.mk
        echo "TARGET_2ND_ARCH_VARIANT := armv7-a-neon" >> ./$REAL_D_PATH/BoardConfig.mk
        echo "TARGET_2ND_CPU_ABI := armeabi-v7a" >> ./$REAL_D_PATH/BoardConfig.mk
        
        echo "TW_THEME := portrait_hdpi" >> ./$REAL_D_PATH/BoardConfig.mk
        echo "DEVICE_RESOLUTION := 1200x1920" >> ./$REAL_D_PATH/BoardConfig.mk
        echo "TARGET_SCREEN_WIDTH := 1200" >> ./$REAL_D_PATH/BoardConfig.mk
        echo "TARGET_SCREEN_HEIGHT := 1920" >> ./$REAL_D_PATH/BoardConfig.mk
        echo "BOARD_AVB_ENABLE := false" >> ./$REAL_D_PATH/BoardConfig.mk
        echo "TW_INCLUDE_CRYPTO := false" >> ./$REAL_D_PATH/BoardConfig.mk
        echo "TW_NEVER_UNMOUNT_SYSTEM := true" >> ./$REAL_D_PATH/BoardConfig.mk
        echo "TW_NO_REBOOT_BOOTLOADER := true" >> ./$REAL_D_PATH/BoardConfig.mk
        echo "TW_HAS_DOWNLOAD_MODE := true" >> ./$REAL_D_PATH/BoardConfig.mk
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Building recovery & Magiskboot Repackaging
      run: |
        # Python 2 -> Python 3 호환성 일괄 패치
        find build/ -type f \( -name "*.py" -o -name "*.mk" \) -exec sed -i 's/\.iteritems()/\.items()/g' {} + || true
        
        sed -i 's/except IOError, ES.ParseError:/except (IOError, ES.ParseError):/g' vendor/omni/build/tools/roomservice.py || true
        sed -i 's/print "\(.*\)"/print("\1")/g' build/tools/check_radio_versions.py || true
        
        # fingerprint 길이 제한 패치 (post_process_props.py 수정)
        sed -i 's/91/128/g' build/tools/post_process_props.py || true
        
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export BUILD_NUMBER="1"
        
        lunch omni_gtaxladwifikx-eng || lunch omni_gtaxladwifikx-userdebug
        
        mkdir -p out/target/product/gtaxladwifikx/system/bin
        touch out/target/product/gtaxladwifikx/system/bin/linker
        touch out/target/product/gtaxladwifikx/system/bin/linker64
        touch out/target/product/gtaxladwifikx/kernel
        
        make recoveryimage -j$(nproc --all)
        
        mkdir -p ../output
        
        wget https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
        unzip -j Magisk-v27.0.apk "lib/x86_64/libmagiskboot.so" -d .
        mv libmagiskboot.so magiskboot
        chmod +x magiskboot
        
        if [ -f ../recovery.img ]; then
          echo "순정 recovery.img 언팩 중..."
          mkdir stock_rec && cd stock_rec
          ../../magiskboot unpack ../../recovery.img
          cd ..
          
          if [ -f out/target/product/gtaxladwifikx/ramdisk-recovery.cpio ]; then
            echo "TWRP ramdisk를 순정 커널/dtb와 정교하게 재합성합니다."
            cp out/target/product/gtaxladwifikx/ramdisk-recovery.cpio stock_rec/ramdisk.cpio
            cd stock_rec
            ../magiskboot repack ../../recovery.img ../../output/recovery.img
            cd ..
          fi
        elif [ -f out/target/product/gtaxladwifikx/recovery.img ]; then
          cp -v out/target/product/gtaxladwifikx/recovery.img ../output/
        fi
        
        if [ -f ../output/recovery.img ]; then
          cd ../output
          tar -cf twrp_smt583_unlocked.tar recovery.img
          cd ..
        fi
        
        ls -la ../output
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: twrp-smt583-unlocked
        path: output/*

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: output/*
        name: sm-t583-twrp-unlocked-build
        tag_name: ${{ github.run_id }}
        body: |
          삼성 갤럭시 탭 Advanced2 (SM-T583) Magiskboot 커널/dtb 재합성 TWRP 빌드 완료.
