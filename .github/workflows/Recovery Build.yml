      - name: Configure Device Tree
        working-directory: workspace
        run: |
          TREE_NAME="${CODENAME_DST:-$CODENAME_SRC}"
          TREE_DIR="device/samsung/${TREE_NAME}"
          echo "TREE_DIR=$TREE_DIR" >> "$GITHUB_ENV"
          mkdir -p device/samsung
          git clone --depth=1 "$DEVICE_TREE_URL" -b "$DEVICE_TREE_BRANCH" "$TREE_DIR"
          rm -rf "$TREE_DIR/.git"
          
          if [ -n "$CODENAME_DST" ] && [ "$CODENAME_DST" != "$CODENAME_SRC" ]; then
            cd "$TREE_DIR"
            find . -depth -name "*${CODENAME_SRC}*" | while read -r p; do
              d=$(dirname "$p"); b=$(basename "$p")
              mv "$p" "$d/${b//$CODENAME_SRC/$CODENAME_DST}"
            done
            grep -rIl -- "$CODENAME_SRC" . | xargs -r sed -i "s/${CODENAME_SRC}/${CODENAME_DST}/g"
            cd - >/dev/null
          fi
          
          if [ -n "$LUNCH_TARGET_IN" ]; then
            LUNCH="$LUNCH_TARGET_IN"
          else
            MK=$(ls "$TREE_DIR"/twrp_*.mk "$TREE_DIR"/omni_*.mk 2>/dev/null | head -n1 || true)
            LUNCH="$(basename "$MK" .mk)-eng"
          fi
          echo "LUNCH=$LUNCH" >> "$GITHUB_ENV"

          # ⭐ [핵심 수정] 커널 추출 + dtb + cmdline
          if [ "$USE_STOCK_KERNEL" = "true" ]; then
            KEXT="$GITHUB_WORKSPACE/kext"
            rm -rf "$KEXT"; mkdir -p "$KEXT"
            ( cd "$KEXT" && \
              cp "$GITHUB_WORKSPACE/stock/stock_recovery.img" boot.img && \
              "$GITHUB_WORKSPACE/tools/magiskboot" unpack boot.img > unpack.log 2>&1 )
            
            # 커널 복사
            if [ -f "$KEXT/kernel" ]; then
              KSZ=$(stat -c%s "$KEXT/kernel")
              echo "[OK] 커널 추출: $KSZ bytes"
              cp "$KEXT/kernel" "$TREE_DIR/Image"
            else
              echo "::error::커널 추출 실패"
              cat "$KEXT/unpack.log"
              exit 1
            fi
            
            # dtb 복사 (있는 경우)
            if [ -f "$KEXT/dtb" ]; then
              DSZ=$(stat -c%s "$KEXT/dtb")
              echo "[OK] dtb 추출: $DSZ bytes"
              cp "$KEXT/dtb" "$TREE_DIR/dtb.img"
              echo "BOARD_PREBUILT_DTB_IMAGE := $TREE_DIR/dtb.img" >> "$TREE_DIR/BoardConfig.mk"
            else
              echo "[INFO] dtb 파일 없음 (커널에 포함된 것으로 추정)"
            fi
            
            # ⭐ cmdline 추가 (SELinux permissive)
            echo "BOARD_KERNEL_CMDLINE := androidboot.selinux=permissive" >> "$TREE_DIR/BoardConfig.mk"
            echo "[OK] cmdline 추가 완료"
            
            # unpack 로그 저장 (디버깅용)
            cat "$KEXT/unpack.log" >> "$GITHUB_STEP_SUMMARY"
          fi
