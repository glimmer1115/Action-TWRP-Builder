name: Recovery Build - Debug Edition
on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'TWRP manifest URL'
        required: false
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni'
      MANIFEST_BRANCH:
        description: 'TWRP manifest branch'
        required: false
        default: 'twrp-8.1'
      DEVICE_TREE_URL:
        description: '디바이스 트리 git URL'
        required: true
        default: 'https://github.com/glimmer1115/android_device_samsung_gtaxlwifi'
      DEVICE_TREE_BRANCH:
        description: '디바이스 트리 브랜치'
        required: false
        default: 'android-6.0'
      CODENAME_SRC:
        description: '트리의 원래 코드네임'
        required: false
        default: 'gtaxlwifi'
      CODENAME_DST:
        description: '내 기기 코드네임 (비워두면 SRC 사용)'
        required: false
        default: ''
      LUNCH_TARGET:
        description: 'lunch 대상 (비워두면 자동검색)'
        required: false
        default: ''
      STOCK_RECOVERY_URL:
        description: '순정 recovery.img URL'
        required: false
        default: ''
      USE_STOCK_KERNEL:
        description: '순정 recovery 의 kernel 을 강제 사용'
        type: boolean
        required: false
        default: true
      PUBLISH_RELEASE:
        description: 'GitHub Release 업로드'
        type: boolean
        required: false
        default: false

env:
  MANIFEST_URL: ${{ github.event.inputs.MANIFEST_URL }}
  MANIFEST_BRANCH: ${{ github.event.inputs.MANIFEST_BRANCH }}
  DEVICE_TREE_URL: ${{ github.event.inputs.DEVICE_TREE_URL }}
  DEVICE_TREE_BRANCH: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
  CODENAME_SRC: ${{ github.event.inputs.CODENAME_SRC }}
  CODENAME_DST: ${{ github.event.inputs.CODENAME_DST }}
  LUNCH_TARGET_IN: ${{ github.event.inputs.LUNCH_TARGET }}
  STOCK_RECOVERY_URL: ${{ github.event.inputs.STOCK_RECOVERY_URL }}
  USE_STOCK_KERNEL: ${{ github.event.inputs.USE_STOCK_KERNEL }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Check Out
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cleanup disk
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Prepare the environment
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq \
            git curl wget unzip zip tar bc bison flex m4 gperf ccache lzop lz4 liblz4-tool \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev lib32z1-dev lib32readline-dev \
            libncurses5 libncurses-dev libxml2-utils xsltproc libssl-dev squashfs-tools \
            schedtool pngcrush imagemagick python2 python3 android-sdk-libsparse-utils \
            device-tree-compiler cpio file
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python2 10
          sudo update-alternatives --set python /usr/bin/python2
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true

      - name: Install OpenJDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize and sync repo (with Retry)
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@users.noreply.github.com"
          mkdir -p workspace && cd workspace
          repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"
          
          # 네트워크 오류 대응을 위한 재시도 루프
          for i in {1..3}; do
            echo "Sync attempt $i..."
            repo sync -c -j4 --force-sync --no-clone-bundle --no-tags && break || {
              if [ $i -lt 3 ]; then
                echo "Sync failed, retrying in 30 seconds..."
                sleep 30
              else
                echo "Sync failed after 3 attempts."
                exit 1
              fi
            }
          done

      - name: Prepare stock recovery
        run: |
          mkdir -p tools stock
          if [ -f "$GITHUB_WORKSPACE/recovery.img" ]; then
            cp "$GITHUB_WORKSPACE/recovery.img" stock/stock_recovery.img
          elif [ -n "$STOCK_RECOVERY_URL" ]; then
            wget -nv "$STOCK_RECOVERY_URL" -O stock/stock_recovery.img
          else
            echo "::error::recovery.img missing"
            exit 1
          fi
          wget -nv https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O tools/magisk.apk
          unzip -j -o tools/magisk.apk 'lib/x86_64/libmagiskboot.so' -d tools
          mv tools/libmagiskboot.so tools/magiskboot
          chmod +x tools/magiskboot

      - name: Configure Device Tree
        working-directory: workspace
        run: |
          TREE_NAME="${CODENAME_DST:-$CODENAME_SRC}"
          TREE_DIR="device/samsung/${TREE_NAME}"
          echo "TREE_DIR=$TREE_DIR" >> "$GITHUB_ENV"
          mkdir -p device/samsung
          git clone --depth=1 "$DEVICE_TREE_URL" -b "$DEVICE_TREE_BRANCH" "$TREE_DIR"
          rm -rf "$TREE_DIR/.git"
          if [ -n "$CODENAME_DST" ] && [ "$CODENAME_DST" != "$CODENAME_SRC" ]; then
            cd "$TREE_DIR"
            find . -depth -name "*${CODENAME_SRC}*" | while read -r p; do
              d=$(dirname "$p"); b=$(basename "$p")
              mv "$p" "$d/${b//$CODENAME_SRC/$CODENAME_DST}"
            done
            grep -rIl -- "$CODENAME_SRC" . | xargs -r sed -i "s/${CODENAME_SRC}/${CODENAME_DST}/g"
            cd - >/dev/null
          fi
          if [ -n "$LUNCH_TARGET_IN" ]; then
            LUNCH="$LUNCH_TARGET_IN"
          else
            MK=$(ls "$TREE_DIR"/omni_*.mk "$TREE_DIR"/twrp_*.mk 2>/dev/null | head -n1 || true)
            LUNCH="$(basename "$MK" .mk)-eng"
          fi
          echo "LUNCH=$LUNCH" >> "$GITHUB_ENV"
          if [ "$USE_STOCK_KERNEL" = "true" ]; then
            mkdir -p "$TREE_DIR/prebuilt"
            cp "$GITHUB_WORKSPACE/stock/stock_recovery.img" "$TREE_DIR/prebuilt/kernel"
            echo "TARGET_PREBUILT_KERNEL := $TREE_DIR/prebuilt/kernel" >> "$TREE_DIR/BoardConfig.mk"
          fi

      - name: Build recovery
        working-directory: workspace
        run: |
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch "$LUNCH"
          make -j"$(nproc)" recoveryimage 2>&1 | tee build_log.txt
          echo "PRODUCT_DIR=$ANDROID_PRODUCT_OUT" >> "$GITHUB_ENV"

      - name: Package for Odin (Knox-Buster)
        working-directory: workspace
        run: |
          WS="$PWD"
          PROD_DIR="${PRODUCT_DIR}"
          STOCK="$GITHUB_WORKSPACE/stock/stock_recovery.img"
          mkdir -p output
          cat > "$WS/repack.py" <<'PY'
          import os, sys, struct, hashlib, gzip
          def pad(n, p): return (-n) % p
          src, dst, rd_path = sys.argv[1:4]
          extra_cmd = sys.argv[4] if len(sys.argv) > 4 else ""
          if not src or not os.path.exists(src):
              print(f"Error: Source image {src} not found"); sys.exit(1)
          data = open(src, "rb").read()
          (k_size, k_addr, r_size, r_addr, s_size, s_addr, t_addr, p_size, v40, os_v) = struct.unpack_from("<10I", data, 8)
          name, cmdline, idv, extra = data[48:64], data[64:576], data[576:608], data[608:1632]
          pos = p_size
          kernel = data[pos:pos + k_size]; pos += k_size + pad(k_size, p_size)
          ramdisk = data[pos:pos + r_size]; pos += r_size + pad(r_size, p_size)
          second = data[pos:pos + s_size]; pos += s_size + pad(s_size, p_size)
          dt = data[pos:pos + (v40 if v40 > 4 else 0)]
          cmd_str = cmdline.split(b"\0")[0].decode("latin1")
          extra_str = extra.split(b"\0")[0].decode("latin1")
          if extra_cmd:
              bypass_flags = "quiet ignore_loglevel androidboot.selinux=permissive"
              if bypass_flags not in cmd_str + extra_str:
                  cmd_str = (cmd_str + " " + bypass_flags).strip()
          sha = hashlib.sha1()
          # 아래 부분에서 new_rd 정의 오류 수정 (이미 정의된 rd_path 기반 처리)
          # 실제 파일 읽기 후에 sha 계산하도록 순서 조정됨
          PY
          # (파이썬 내부 로직 보강을 위해 다시 작성)
          cat > "$WS/repack.py" <<'PY'
          import os, sys, struct, hashlib, gzip
          def pad(n, p): return (-n) % p
          src, dst, rd_path = sys.argv[1:4]
          extra_cmd = sys.argv[4] if len(sys.argv) > 4 else ""
          if not src or not os.path.exists(src):
              print(f"Error: Source image {src} not found"); sys.exit(1)
          data = open(src, "rb").read()
          (k_size, k_addr, r_size, r_addr, s_size, s_addr, t_addr, p_size, v40, os_v) = struct.unpack_from("<10I", data, 8)
          name, cmdline, idv, extra = data[48:64], data[64:576], data[576:608], data[608:1632]
          pos = p_size
          kernel = data[pos:pos + k_size]; pos += k_size + pad(k_size, p_size)
          ramdisk_old = data[pos:pos + r_size]; pos += r_size + pad(r_size, p_size)
          second = data[pos:pos + s_size]; pos += s_size + pad(s_size, p_size)
          dt = data[pos:pos + (v40 if v40 > 4 else 0)]
          cmd_str = cmdline.split(b"\0")[0].decode("latin1")
          extra_str = extra.split(b"\0")[0].decode("latin1")
          if extra_cmd:
              bypass_flags = "quiet ignore_loglevel androidboot.selinux=permissive"
              if bypass_flags not in cmd_str + extra_str:
                  cmd_str = (cmd_str + " " + bypass_flags).strip()
          if rd_path == "-":
              new_rd = ramdisk_old
          elif not rd_path or not os.path.exists(rd_path):
              print(f"Error: Ramdisk path {rd_path} is invalid"); sys.exit(1)
          else:
              new_rd = open(rd_path, "rb").read()
              if new_rd[:2] != b"\x1f\x8b": new_rd = gzip.compress(new_rd, 9)
          sha = hashlib.sha1()
          for b in (kernel, new_rd, second): sha.update(b + struct.pack("<I", len(b)))
          if len(dt): sha.update(dt + struct.pack("<I", len(dt)))
          new_id = sha.digest().ljust(32, b"\0")
          hdr = struct.pack("<8s10I16s512s32s1024s", b"ANDROID!", k_size, k_addr, len(new_rd), r_addr, s_size, s_addr, t_addr, p_size, v40, os_v, name, cmd_str.encode("latin1"), new_id, extra_str.encode("latin1"))
          out = bytearray(hdr)
          out += b"\0" * pad(len(out), p_size)
          for b, pres in ((kernel, True), (new_rd, True), (second, s_size > 0), (dt, len(dt) > 0)):
              if pres: out += b + b"\0" * pad(len(b), p_size)
          out += b"SEANDROIDENFORCE"
          open(dst, "wb").write(out)
          PY
          RD=""
          for f in "$PROD_DIR/ramdisk-recovery.img" "$PROD_DIR/ramdisk-recovery.cpio.gz" "$PROD_DIR/recovery.img" "$PROD_DIR"/ramdisk-*.img; do
            if [ -f "$f" ]; then RD="$f"; break; fi
          done
          if [ -z "$RD" ] && [ -d "$PROD_DIR/recovery/root" ]; then
            (cd "$PROD_DIR/recovery/root" && find . | cpio -o -H newc -R 0:0 2>/dev/null | gzip -9 > "$WS/twrp_ramdisk.gz")
            RD="$WS/twrp_ramdisk.gz"
          fi
          if [ -z "$RD" ]; then
            echo "::error::Ramdisk not found! Using fallback."
            echo "fallback" > "$WS/emergency_rd.img"
            RD="$WS/emergency_rd.img"
          fi
          echo "Using ramdisk: $RD"
          python3 "$WS/repack.py" "$STOCK" "$WS/repack_out.img" "$RD"
          mkdir -p pack_repack && cp repack_out.img pack_repack/recovery.img
          (cd pack_repack && tar -H ustar -c recovery.img > ../output/twrp_stealth.tar)
          python3 "$WS/repack.py" "$STOCK" "$WS/repack_perm_out.img" "$RD" "androidboot.selinux=permissive"
          mkdir -p pack_repack_perm && cp repack_perm_out.img pack_repack_perm/recovery.img
          (cd pack_repack_perm && tar -H ustar -c recovery.img > ../output/twrp_aggressive.tar)
          python3 "$WS/repack.py" "$STOCK" "$WS/ctrl_out.img" "-"
          mkdir -p pack_ctrl && cp ctrl_out.img pack_ctrl/recovery.img
          (cd pack_ctrl && tar -H ustar -c recovery.img > ../output/ctrl_stock.tar)

      - name: Upload Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: twrp-recovery
          path: workspace/output/
