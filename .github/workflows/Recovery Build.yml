name: Recovery Build
on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'TWRP manifest URL'
        required: false
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni'
      MANIFEST_BRANCH:
        description: 'TWRP manifest branch (8.0 펌웨어 기기라 twrp-8.1 권장, 안 되면 twrp-9.0)'
        required: false
        default: 'twrp-8.1'
      DEVICE_TREE_URL:
        description: '디바이스 트리 git URL (필수)'
        required: true
      DEVICE_TREE_BRANCH:
        description: '디바이스 트리 브랜치'
        required: false
        default: 'android-6.0'
      CODENAME_SRC:
        description: '트리의 원래 코드네임'
        required: false
        default: 'gtaxlwifi'
      CODENAME_DST:
        description: '내 기기 코드네임 (비우면 치환 안 함)'
        required: false
        default: ''
      LUNCH_TARGET:
        description: 'lunch 대상 (비우면 트리에서 자동 탐지, 예: omni_gtaxlwifi-eng)'
        required: false
        default: ''
      STOCK_RECOVERY_URL:
        description: '순정 recovery.img URL (저장소 루트에 recovery.img 가 있으면 무시됨, 보통 비워둘 것)'
        required: false
        default: ''
      USE_STOCK_KERNEL:
        description: '순정 recovery 의 kernel 을 TARGET_PREBUILT_KERNEL 로 강제 사용'
        type: boolean
        required: false
        default: false
      PUBLISH_RELEASE:
        description: 'GitHub Release 로도 업로드'
        type: boolean
        required: false
        default: false

env:
  MANIFEST_URL: ${{ github.event.inputs.MANIFEST_URL }}
  MANIFEST_BRANCH: ${{ github.event.inputs.MANIFEST_BRANCH }}
  DEVICE_TREE_URL: ${{ github.event.inputs.DEVICE_TREE_URL }}
  DEVICE_TREE_BRANCH: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
  CODENAME_SRC: ${{ github.event.inputs.CODENAME_SRC }}
  CODENAME_DST: ${{ github.event.inputs.CODENAME_DST }}
  LUNCH_TARGET_IN: ${{ github.event.inputs.LUNCH_TARGET }}
  STOCK_RECOVERY_URL: ${{ github.event.inputs.STOCK_RECOVERY_URL }}
  USE_STOCK_KERNEL: ${{ github.event.inputs.USE_STOCK_KERNEL }}

jobs:
  build:
    # Android 8.1 빌드는 최신 24.04 보다 22.04 가 호환성이 좋다
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Check Out
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cleanup disk
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Prepare the environment
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq \
            git curl wget unzip zip tar bc bison flex m4 gperf ccache lzop lz4 liblz4-tool \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev lib32z1-dev lib32readline-dev \
            libncurses5 libncurses-dev libxml2-utils xsltproc libssl-dev squashfs-tools \
            schedtool pngcrush imagemagick python2 python3 android-sdk-libsparse-utils \
            device-tree-compiler cpio file

          # Android 8.1 빌드 시스템은 python2 기준이다 (소스 파일을 sed 로 고치지 않는다)
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python2 10
          sudo update-alternatives --set python /usr/bin/python2
          python --version

          # 구버전 호스트 바이너리용 심볼릭 링크
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true

      - name: Install OpenJDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Validate inputs
        run: |
          if [ -z "$DEVICE_TREE_URL" ]; then
            echo "::error::DEVICE_TREE_URL 이 필요합니다. 검증된 gtaxlwifi 계열 트리를 넣어주세요."
            exit 1
          fi

      - name: Initialize and sync repo
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@users.noreply.github.com"
          mkdir -p workspace && cd workspace
          repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags

      - name: Prepare stock recovery (header info)
        run: |
          mkdir -p tools stock

          # 1) 순정 recovery.img 확보: 저장소 루트 파일 우선, 없으면 URL
          if [ -f "$GITHUB_WORKSPACE/recovery.img" ]; then
            echo "저장소 루트의 recovery.img 사용"
            cp "$GITHUB_WORKSPACE/recovery.img" stock/stock_recovery.img
          elif [ -n "$STOCK_RECOVERY_URL" ]; then
            echo "URL 에서 다운로드: $STOCK_RECOVERY_URL"
            if ! wget -nv "$STOCK_RECOVERY_URL" -O stock/stock_recovery.img; then
              echo "::error::STOCK_RECOVERY_URL 다운로드 실패 (private 저장소이거나 주소가 틀림). 저장소 루트에 recovery.img 를 올리고 URL 칸은 비우세요."
              exit 1
            fi
          else
            echo "::error::recovery.img 가 저장소 루트에 없고 STOCK_RECOVERY_URL 도 비어 있습니다."
            exit 1
          fi

          SIZE=$(stat -c %s stock/stock_recovery.img)
          echo "stock recovery size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::recovery.img 가 비정상적으로 작습니다 (LFS 포인터이거나 잘못된 파일)."
            head -c 300 stock/stock_recovery.img || true
            exit 1
          fi

          # 2) magiskboot 준비 (Magisk APK 안에 들어 있음, 버전 고정)
          wget -nv https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O tools/magisk.apk
          unzip -j -o tools/magisk.apk 'lib/x86_64/libmagiskboot.so' -d tools
          mv tools/libmagiskboot.so tools/magiskboot
          chmod +x tools/magiskboot

          # 3) 헤더 정보 출력 (실패해도 빌드는 계속)
          cd stock
          ../tools/magiskboot unpack -h stock_recovery.img || echo "magiskboot unpack 실패 (헤더 정보만 생략)"
          echo "===== 순정 recovery 헤더 정보 (BoardConfig.mk 의 cmdline/base/pagesize 와 비교) ====="
          cat header 2>/dev/null || true
          echo "============================================================================"
          ls -l

      - name: Configure Device Tree
        working-directory: workspace
        run: |
          TREE_NAME="${CODENAME_DST:-$CODENAME_SRC}"
          TREE_DIR="device/samsung/${TREE_NAME}"
          echo "TREE_DIR=$TREE_DIR" >> "$GITHUB_ENV"

          mkdir -p device/samsung
          echo "===== 원격 저장소의 브랜치 목록 ====="
          git ls-remote --heads "$DEVICE_TREE_URL" | sed 's#.*refs/heads/##' || true
          echo "===================================="
          if ! git ls-remote --exit-code --heads "$DEVICE_TREE_URL" "$DEVICE_TREE_BRANCH" >/dev/null 2>&1; then
            echo "::error::브랜치 '$DEVICE_TREE_BRANCH' 가 없습니다. 위 목록에서 실제 브랜치명을 DEVICE_TREE_BRANCH 에 넣으세요."
            exit 1
          fi
          git clone --depth=1 "$DEVICE_TREE_URL" -b "$DEVICE_TREE_BRANCH" "$TREE_DIR"
          rm -rf "$TREE_DIR/.git"

          # 코드네임 치환 (파일/폴더 이름 + 내용)
          if [ -n "$CODENAME_DST" ] && [ "$CODENAME_DST" != "$CODENAME_SRC" ]; then
            echo "Renaming $CODENAME_SRC -> $CODENAME_DST"
            cd "$TREE_DIR"
            find . -depth -name "*${CODENAME_SRC}*" | while read -r p; do
              d=$(dirname "$p"); b=$(basename "$p")
              mv "$p" "$d/${b//$CODENAME_SRC/$CODENAME_DST}"
            done
            grep -rIl -- "$CODENAME_SRC" . | xargs -r sed -i "s/${CODENAME_SRC}/${CODENAME_DST}/g"
            cd - >/dev/null
          fi

          # lunch 대상 자동 탐지
          if [ -n "$LUNCH_TARGET_IN" ]; then
            LUNCH="$LUNCH_TARGET_IN"
          else
            MK=$(ls "$TREE_DIR"/omni_*.mk "$TREE_DIR"/twrp_*.mk 2>/dev/null | head -n1 || true)
            if [ -z "$MK" ]; then
              echo "::error::omni_*.mk / twrp_*.mk 를 트리에서 찾지 못했습니다. LUNCH_TARGET 을 직접 지정하세요."
              ls -la "$TREE_DIR"
              exit 1
            fi
            LUNCH="$(basename "$MK" .mk)-eng"
          fi
          echo "LUNCH=$LUNCH" >> "$GITHUB_ENV"
          echo "lunch target: $LUNCH"

          # 순정 커널 강제 사용 (옵션)
          if [ "$USE_STOCK_KERNEL" = "true" ]; then
            mkdir -p "$TREE_DIR/prebuilt"
            cp "$GITHUB_WORKSPACE/stock/kernel" "$TREE_DIR/prebuilt/kernel"
            echo "TARGET_PREBUILT_KERNEL := $TREE_DIR/prebuilt/kernel" >> "$TREE_DIR/BoardConfig.mk"
          fi

          echo "===== BoardConfig.mk ====="
          cat "$TREE_DIR/BoardConfig.mk"

      - name: Build recovery
        working-directory: workspace
        run: |
          set +e
          set +u
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export WITH_DEXPREOPT=false
          source build/envsetup.sh
          lunch "$LUNCH"

          PRODUCT_DIR="$ANDROID_PRODUCT_OUT"
          echo "PRODUCT_DIR=$PRODUCT_DIR" >> "$GITHUB_ENV"
          echo "product out: $PRODUCT_DIR"
          STOCK_IMG="$GITHUB_WORKSPACE/stock/stock_recovery.img"

          # 순정 이미지에서 DT 만 뽑아내는 도우미 (dt.img 대체용)
          cat > mkdt.py <<'PY'
          import sys, struct
          d = open(sys.argv[1], "rb").read()
          ks, ka, rs, ra, ss, sa, ta, ps, dts, ov = struct.unpack_from("<10I", d, 8)
          pad = lambda n: (-n) % ps
          pos = ps
          pos += ks + pad(ks)
          pos += rs + pad(rs)
          pos += ss + pad(ss)
          dt = d[pos:pos + dts] if dts > 4 else b""
          open(sys.argv[2], "wb").write(dt)
          print("dt.img bytes:", len(dt))
          PY

          : > build.log
          run_make() {
            make -j"$(nproc)" "$@" 2>&1 | tee run.log
            local rc="${PIPESTATUS[0]}"
            cat run.log >> build.log
            return "$rc"
          }

          # ninja 가 "파일 X 가 없고 만드는 규칙도 없다" 고 하면, X 가 산출물 폴더 안의 파일일 때
          # 대체 파일(dt.img 는 순정 DT, 다른 .img 는 순정 이미지 복사, 그 외는 빈 파일)을 만들고 재시도한다.
          # 최종 결과물은 "순정 커널/DT + TWRP 램디스크" repack 이라 이 대체 파일들은 영향이 없다.
          build_with_placeholders() {
            local target="$1" i rc missing base
            for i in 1 2 3 4 5 6 7 8; do
              run_make "$target"
              rc=$?
              if [ "$rc" -eq 0 ]; then return 0; fi
              if ! grep -q "missing and no known rule" run.log; then return "$rc"; fi
              missing=$(grep -o "ninja: error: '[^']*', needed by" run.log | tail -n1 | sed -E "s/^ninja: error: '([^']*)'.*/\1/")
              if [ -z "$missing" ]; then return "$rc"; fi
              case "$missing" in
                "$PRODUCT_DIR"/*) ;;
                *) echo "::warning::산출물 폴더 밖의 파일이라 대체하지 않음: $missing"; return "$rc" ;;
              esac
              if [ -e "$missing" ]; then return "$rc"; fi
              base=$(basename "$missing")
              echo "::warning::[$i] 규칙 없는 파일을 대체 생성: $base"
              mkdir -p "$(dirname "$missing")"
              case "$base" in
                dt.img) python3 mkdt.py "$STOCK_IMG" "$missing" ;;
                *.img)  cp "$STOCK_IMG" "$missing" ;;
                *)      : > "$missing" ;;
              esac
            done
            return "$rc"
          }

          # 1차: recovery.img 까지 빌드
          build_with_placeholders recoveryimage
          RC=$?

          # 2차: 그래도 실패하면 TWRP 램디스크만이라도 만든다
          if [ "$RC" -ne 0 ]; then
            echo "::warning::recoveryimage 실패 -> ramdisk-recovery.img 단독 빌드를 시도합니다"
            build_with_placeholders "$PRODUCT_DIR/ramdisk-recovery.img"
            RC=$?
          fi

          if [ -f "$PRODUCT_DIR/recovery.img" ] || [ -f "$PRODUCT_DIR/ramdisk-recovery.img" ] || [ -d "$PRODUCT_DIR/recovery/root" ]; then
            echo "TWRP 산출물 확인됨 (recovery.img / ramdisk-recovery.img / recovery/root 중 하나 이상)"
            ls -la "$PRODUCT_DIR" | head -n 60
            exit 0
          fi

          echo "::error::TWRP 산출물을 만들지 못했습니다. 아래는 로그 마지막 50줄입니다."
          tail -n 50 build.log
          exit 1

      - name: Package for Odin
        working-directory: workspace
        run: |
          WS="$PWD"
          PROD_DIR="${PRODUCT_DIR:-$(dirname "$(ls out/target/product/*/recovery.img out/target/product/*/ramdisk-recovery.img 2>/dev/null | head -n1)")}"
          IMG="$PROD_DIR/recovery.img"
          [ -f "$IMG" ] || IMG=""
          echo "product dir: $PROD_DIR"
          echo "built recovery.img: ${IMG:-없음 (램디스크만 사용)}"
          echo "===== 빌드 산출물 목록 ====="
          ls -la "$PROD_DIR" | head -n 60
          mkdir -p output

          # boot 이미지 ramdisk 교체용 순수 파이썬 스크립트 (magiskboot 에 의존하지 않음)
          cat > "$WS/repack.py" <<'PY'
          #!/usr/bin/env python3
          """boot/recovery 이미지(헤더 v0, 삼성 포함)에서 ramdisk 만 교체한다.
          usage: repack.py <in.img> <out.img> <ramdisk.gz|-> [extra_cmdline]
          ramdisk 가 '-' 이면 원본 ramdisk 를 그대로 사용한다 (대조군).
          환경변수 DUMP_RD=<경로> 가 있으면 원본 ramdisk 를 그 경로에 저장한다 (진단용)."""
          import os, sys, struct, hashlib, gzip

          def pad(n, p):
              return (-n) % p

          src, dst, rd_path = sys.argv[1:4]
          extra_cmd = sys.argv[4] if len(sys.argv) > 4 else ""

          data = open(src, "rb").read()
          if data[:8] != b"ANDROID!":
              sys.exit("ERROR: ANDROID! 매직이 없습니다 (boot image 가 아님)")

          (kernel_size, kernel_addr, ramdisk_size, ramdisk_addr, second_size, second_addr,
           tags_addr, page_size, v40, os_version) = struct.unpack_from("<10I", data, 8)
          name = data[48:64]
          cmdline = data[64:576]
          idv = data[576:608]
          extra = data[608:1632]

          header_version = v40 if v40 <= 4 else 0
          dt_size = v40 if v40 > 4 else 0
          if header_version >= 1:
              sys.exit("ERROR: header_version=%d 는 지원하지 않습니다" % header_version)

          pos = page_size
          kernel = data[pos:pos + kernel_size]
          pos += kernel_size + pad(kernel_size, page_size)
          ramdisk = data[pos:pos + ramdisk_size]
          pos += ramdisk_size + pad(ramdisk_size, page_size)
          second = data[pos:pos + second_size]
          pos += second_size + pad(second_size, page_size)
          dt = data[pos:pos + dt_size]

          if os.environ.get("DUMP_RD"):
              open(os.environ["DUMP_RD"], "wb").write(ramdisk)

          cmd_str = cmdline.split(b"\0")[0].decode("latin1")
          extra_str = extra.split(b"\0")[0].decode("latin1")
          print("== 원본 헤더 ==")
          print("kernel_size=%d ramdisk_size=%d second_size=%d dt_size=%d page_size=%d" %
                (kernel_size, ramdisk_size, second_size, dt_size, page_size))
          print("kernel_addr=0x%x ramdisk_addr=0x%x tags_addr=0x%x os_version=0x%x" %
                (kernel_addr, ramdisk_addr, tags_addr, os_version))
          print("cmdline=" + cmd_str)
          if extra_str:
              print("extra_cmdline=" + extra_str)
          print("ramdisk magic: " + ramdisk[:6].hex())

          if rd_path == "-":
              new_rd = ramdisk
          else:
              new_rd = open(rd_path, "rb").read()
              if new_rd[:2] != b"\x1f\x8b":
                  if new_rd[:6] == b"070701":
                      new_rd = gzip.compress(new_rd, 9)
                  else:
                      sys.exit("ERROR: 알 수 없는 ramdisk 형식: " + new_rd[:6].hex())

          if extra_cmd and extra_cmd not in cmd_str + " " + extra_str:
              if len(cmd_str) + 1 + len(extra_cmd) <= 511:
                  cmd_str = (cmd_str + " " + extra_cmd).strip()
              else:
                  extra_str = (extra_str + " " + extra_cmd).strip()

          sha = hashlib.sha1()
          for blob in (kernel, new_rd, second):
              sha.update(blob)
              sha.update(struct.pack("<I", len(blob)))
          if dt_size:
              sha.update(dt)
              sha.update(struct.pack("<I", dt_size))
          new_id = sha.digest().ljust(32, b"\0")

          hdr = struct.pack("<8s10I16s512s32s1024s", b"ANDROID!", kernel_size, kernel_addr,
                            len(new_rd), ramdisk_addr, second_size, second_addr, tags_addr,
                            page_size, v40, os_version, name,
                            cmd_str.encode("latin1"), new_id, extra_str.encode("latin1"))

          out = bytearray(hdr)
          out += b"\0" * pad(len(out), page_size)
          for blob, present in ((kernel, True), (new_rd, True), (second, second_size > 0), (dt, dt_size > 0)):
              if present:
                  out += blob + b"\0" * pad(len(blob), page_size)
          out += b"SEANDROIDENFORCE"
          open(dst, "wb").write(out)

          print("== 새 헤더 ==")
          print("ramdisk_size=%d (원본 %d) 최종 크기=%d" % (len(new_rd), ramdisk_size, len(out)))
          print("cmdline=" + cmd_str)
          PY

          add_marker() {
            if ! tail -c 16 "$1" | grep -q "SEANDROIDENFORCE"; then
              printf 'SEANDROIDENFORCE' >> "$1"
            fi
          }

          STOCK="$GITHUB_WORKSPACE/stock/stock_recovery.img"

          # A) 트리가 만든 recovery.img 그대로 (native)
          if [ -n "$IMG" ]; then
            mkdir -p pack_native
            cp "$IMG" pack_native/recovery.img
            add_marker pack_native/recovery.img
            (cd pack_native && tar -H ustar -c recovery.img > ../output/twrp_native.tar)
            cp pack_native/recovery.img output/recovery_native.img
          else
            echo "::warning::recovery.img 없음 -> native 이미지는 건너뜁니다 (repack 은 계속 진행)"
          fi

          # TWRP ramdisk 찾기 (파일이 없으면 recovery/root 폴더에서 직접 만든다)
          RD=""
          for f in "$PROD_DIR/ramdisk-recovery.img" "$PROD_DIR/ramdisk-recovery.cpio" "$PROD_DIR/ramdisk-recovery.cpio.gz"; do
            if [ -f "$f" ]; then RD="$f"; break; fi
          done
          if [ -z "$RD" ] && [ -d "$PROD_DIR/recovery/root" ]; then
            echo "ramdisk 파일이 없어 recovery/root 에서 직접 생성합니다"
            (cd "$PROD_DIR/recovery/root" && find . | cpio -o -H newc -R 0:0 2>/dev/null | gzip -9 > "$WS/twrp_ramdisk.gz")
            RD="$WS/twrp_ramdisk.gz"
          fi
          echo "ramdisk 사용 파일: ${RD:-없음}"

          # C) 대조군: 순정 ramdisk 를 그대로 다시 묶은 이미지 (TWRP 없음, 부팅되어야 정상)
          #    이 호출에서 순정 ramdisk 원본도 stock_rd.bin 으로 덤프한다 (진단용)
          if DUMP_RD="$WS/stock_rd.bin" python3 "$WS/repack.py" "$STOCK" "$WS/ctrl_out.img" "-"; then
            mkdir -p pack_ctrl
            cp ctrl_out.img pack_ctrl/recovery.img
            (cd pack_ctrl && tar -H ustar -c recovery.img > ../output/ctrl_stock_repack.tar)
          fi

          # B1) 순정 커널/DT/헤더/cmdline 그대로 + TWRP ramdisk 만 교체 (cmdline 변수 제거)
          if [ -n "$RD" ] && python3 "$WS/repack.py" "$STOCK" "$WS/repack_out.img" "$RD"; then
            mkdir -p pack_repack
            cp repack_out.img pack_repack/recovery.img
            (cd pack_repack && tar -H ustar -c recovery.img > ../output/twrp_repack.tar)
            cp pack_repack/recovery.img output/recovery_repack.img
          else
            echo "::warning::repack(B1) 실패. 위 로그를 확인하세요."
          fi

          # B2) B1 + androidboot.selinux=permissive (대조용: B1 과 B2 의 차이는 cmdline 뿐)
          if [ -n "$RD" ] && python3 "$WS/repack.py" "$STOCK" "$WS/repack_perm_out.img" "$RD" "androidboot.selinux=permissive"; then
            mkdir -p pack_repack_perm
            cp repack_perm_out.img pack_repack_perm/recovery.img
            (cd pack_repack_perm && tar -H ustar -c recovery.img > ../output/twrp_repack_permissive.tar)
          else
            echo "::warning::repack(B2) 실패. 위 로그를 확인하세요."
          fi

          echo "===== 크기 비교 ====="
          echo "stock  : $(stat -c %s "$STOCK") bytes"
          [ -f output/recovery_native.img ] && echo "native : $(stat -c %s output/recovery_native.img) bytes"
          [ -f output/recovery_repack.img ] && echo "repack : $(stat -c %s output/recovery_repack.img) bytes"
          [ -f pack_ctrl/recovery.img ] && echo "ctrl   : $(stat -c %s pack_ctrl/recovery.img) bytes"
          [ -n "$RD" ] && echo "twrp ramdisk : $(stat -c %s "$RD") bytes"
          [ -f "$WS/stock_rd.bin" ] && echo "stock ramdisk: $(stat -c %s "$WS/stock_rd.bin") bytes"

          # ------------------------------------------------------------
          # 진단: 순정 ramdisk 와 TWRP ramdisk 의 구조 차이를 로그/아티팩트로 남긴다
          # (기기 로그 없이도 init / sepolicy / fstab 차이를 눈으로 비교하기 위함)
          # ------------------------------------------------------------
          DIAG="$WS/output/diag"
          mkdir -p "$DIAG"

          decomp() {
            local m
            m=$(head -c4 "$1" | od -An -tx1 | tr -d ' \n')
            case "$m" in
              1f8b*)    zcat "$1" ;;
              02214c18) lz4 -dc "$1" ;;
              303730*)  cat "$1" ;;
              *) echo "알 수 없는 ramdisk 매직: $m" >&2; return 1 ;;
            esac
          }

          dump_rd() {
            local name="$1" f="$2" dir="$WS/diag_$1"
            rm -rf "$dir"; mkdir -p "$dir"
            if ! decomp "$f" > "$WS/diag_$name.cpio"; then
              echo "[$name] ramdisk 압축 해제 실패"; return 0
            fi
            cpio -t < "$WS/diag_$name.cpio" 2>/dev/null | sort > "$DIAG/${name}_files.txt"
            (cd "$dir" && cpio -idm --no-absolute-filenames < "$WS/diag_$name.cpio" >/dev/null 2>&1) || true

            echo
            echo "################ [$name] ################"
            echo "파일 수: $(wc -l < "$DIAG/${name}_files.txt")"
            echo "--- init 바이너리"
            file "$dir/init" 2>/dev/null || echo "init 없음"
            echo "--- 루트 항목"
            ls -l "$dir" 2>/dev/null | head -n 60
            echo "--- sepolicy / 정책 파일"
            ls -l "$dir"/sepolicy "$dir"/plat_sepolicy* "$dir"/selinux_version "$dir"/file_contexts* 2>/dev/null || echo "(없음)"
            echo "--- default.prop"
            cat "$dir/default.prop" 2>/dev/null || echo "(없음)"
            echo "--- init.rc import 목록"
            grep -n '^import' "$dir"/init.rc 2>/dev/null || echo "(없음)"
            echo "--- fstab 류"
            ls -l "$dir"/*fstab* "$dir"/etc/*fstab* "$dir"/etc/recovery.fstab 2>/dev/null || echo "(없음)"
            mkdir -p "$DIAG/${name}_rc"
            cp "$dir"/*.rc "$dir"/default.prop "$dir"/etc/recovery.fstab "$DIAG/${name}_rc/" 2>/dev/null || true
            rm -rf "$dir" "$WS/diag_$name.cpio"
          }

          if [ -f "$WS/stock_rd.bin" ]; then dump_rd stock "$WS/stock_rd.bin"; fi
          if [ -n "$RD" ]; then dump_rd twrp "$RD"; fi

          if [ -f "$DIAG/stock_files.txt" ] && [ -f "$DIAG/twrp_files.txt" ]; then
            echo
            echo "################ 파일 목록 차이 (< 순정만, > TWRP만) ################"
            diff "$DIAG/stock_files.txt" "$DIAG/twrp_files.txt" > "$DIAG/diff_files.txt" || true
            head -n 200 "$DIAG/diff_files.txt"
          fi

          ls -la output

      - name: Upload Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: twrp-recovery
          if-no-files-found: warn
          path: |
            workspace/output/**
            workspace/build.log

      - name: Upload to Release
        if: ${{ github.event.inputs.PUBLISH_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: twrp-${{ github.run_number }}
          name: "TWRP Recovery #${{ github.run_number }}"
          files: workspace/output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
